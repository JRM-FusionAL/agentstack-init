[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentstack-init"
version = "0.1.0"
description = "Audit and scaffold AI harness configs (Claude Code, Hermes) — lead magnet for agentstack consulting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonathan Melton" }]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.1.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentstack-init = "agentstack_init.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentstack_init"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
